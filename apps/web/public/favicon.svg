<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Replaces a leftover purple gradient-blob favicon generated for a product identity
    this app no longer has (a violet AI-dashboard palette, retired in the Charcoal plus
    Electric Blue colour round). It also carried no relationship to what the product
    does. This mark is the same one now used in the app header and the sign-in panel
    (BrandMark.tsx) — three ascending bars ending in a spark, standing for ideas that
    get scored, ranked, and rise to the top — on the app's own charcoal-to-near-black
    gradient (the grad-from/grad-to tokens) with the electric-blue highlight (the
    grad-highlight token) carrying the mark, exactly as it does everywhere else that
    gradient appears.
  -->
  <rect width="32" height="32" rx="8" fill="url(#g)" />
  <path d="M9 24v-5" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" />
  <path d="M16 24v-10" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" />
  <path d="M23 24V9" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" />
  <circle cx="23" cy="6" r="2" fill="#38bdf8" />
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f2937" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
  </defs>
</svg>
