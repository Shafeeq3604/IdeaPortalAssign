services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: iep
      POSTGRES_PASSWORD: iep
      POSTGRES_DB: iep
    ports: ["5432:5432"]
    volumes: ["iep-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iep"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  iep-pg:
