# Validra's deployment manifest. NOT used for local dev — that's docker-compose.deps.yml
# (Postgres+Redis for `pnpm dev`) and docker-compose.full.yml (the whole stack, for local
# testing). This file exists so Validra's own service discovery names all three services
# explicitly, and so the context here matches what Validra's build step actually uses.
#
# Each service builds with ITS OWN DIRECTORY as context, not the repo root — confirmed
# against real Validra build logs: pointing a root docker-compose.yml's `context: .` at
# these Dockerfiles did not change that; Validra's Cloud Build step ignores a compose
# file's build.context and always scopes to the service's own directory. Building each
# Dockerfile from repo root (`COPY . .`) therefore can never see pnpm-lock.yaml or
# packages/contracts, packages/db, etc. — Docker cannot COPY anything from outside the
# build context, on any platform. The real failure this produced:
#
#   [ERR_PNPM_NO_LOCKFILE] Cannot install with "frozen-lockfile" because
#   pnpm-lock.yaml is absent
#
# The fix is on the Dockerfile side: each service's own directory now carries a
# `.deploy/` snapshot (a `turbo prune --docker` mirror of exactly what it needs,
# generated by `pnpm run deploy:prune` and committed) so its Dockerfile is fully
# self-contained under this restricted context. `pnpm run preflight` builds all three
# with this exact context to catch a stale snapshot before a push. No Postgres/Redis
# here — Validra provisions and connects those separately; this file's only job is
# naming the services and their (now correct) build contexts.
services:
  api:
    build:
      context: apps/api
      dockerfile: Dockerfile

  worker:
    build:
      context: apps/worker
      dockerfile: Dockerfile

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
